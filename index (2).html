<style>
:root{--bg:#0b0b0d;--card:#1b1c20;--tx:#f4f4f5;--mu:#9b9da6;--ac:#22e07a;--bd:#2b2d33;--rd:#ff3d8b;--yl:#ffd43b;--bl:#3b9eff;--sh:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid3 .card{margin:0;padding:12px}.grid3 b{font-size:15px}
.pos{color:var(--ac)}.neg{color:var(--rd)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}.chip.on{background:var(--ac);border-color:var(--ac);color:#07130c}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}.tx:last-child{border:0}.tx .g{flex:1;min-width:0}.tx .g b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}.grid3 .card:nth-child(3) b{color:var(--bl)}.ib{background:none;border:0;color:var(--mu);padding:6px;border-radius:8px;cursor:pointer;display:inline-grid;place-items:center}.ib:hover{color:var(--tx)}.ib.d{color:var(--rd)}.ip{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:6px}.ip button{background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:8px;cursor:pointer;display:grid;place-items:center}.ip button.on{border-color:var(--ac);color:var(--ac)}
.demo{color:#111;font-size:11px;background:var(--yl);border-radius:6px;padding:1px 6px;font-style:normal}
.cb{margin:10px 0;cursor:pointer}.cb .t{display:flex;justify-content:space-between;gap:8px}.cb .p{height:8px;background:var(--bd);border-radius:9px;margin-top:5px;overflow:hidden}.cb .p i{display:block;height:100%;border-radius:9px}
.btn,.btn2{border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--ac);color:#07130c}.btn2{background:var(--bd);color:var(--tx)}.red{background:var(--rd);color:#fff}.lnk{background:none;border:0;color:var(--ac);font:inherit;padding:6px 0;cursor:pointer}
.row{display:flex;gap:10px;align-items:end}.row>*{flex:1}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.bar h2{margin:0}
label{display:block;font-size:13px;color:var(--mu);margin-top:10px}input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin-top:4px}
textarea{width:100%;height:120px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px;font:12px monospace}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:8px}.full{margin:0}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}.sheet{background:var(--card);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:800px){.ov{align-items:center}.sheet{border-radius:22px}}
.err{color:var(--rd);font-size:14px;min-height:18px;margin:8px 0}.empty{text-align:center;color:var(--mu);padding:22px 8px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;text-align:right;border-bottom:1px solid var(--bd)}td:first-child,th:first-child{text-align:left}tr[onclick]{cursor:pointer}

.two{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:700px){.two{grid-template-columns:1fr 1fr}}
.warn{background:#ffd43b22;border:1px solid #ffd43b;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:14px}
@media(prefers-reduced-motion:no-preference){#v>*{animation:in .25s ease both}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style></head><body>
<nav id="nav"></nav><main><div id="v"></div></main><div id="m"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const enc=s=>encodeURIComponent(s).replace(/'/g,'%27'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=()=>ds(new Date()),fd=d=>d.split('-').reverse().join('/');
const ML=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'],ml=k=>ML[+k.slice(5)-1]+'/'+k.slice(2,4);
const IC={pen:'<path d="M4 20l1-4L16 5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',up:'<path d="M7 17L17 7M8 7h9v9"/>',down:'<path d="M17 7L7 17M16 17H7V8"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',wallet:'<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l3-3h11v3M16 13.5h2"/>',car:'<path d="M3 17v-5l2-5h14l2 5v5zM3 12h18"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/>',utensils:'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/>',film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',cap:'<path d="M2 9l10-5 10 5-10 5zM6 11v5c3 2.5 9 2.5 12 0v-5"/>',box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>',tag:'<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.2"/>',coffee:'<path d="M5 8h11v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4zM16 9h2a2 2 0 0 1 0 4h-2M7 3v2M11 3v2"/>',gift:'<path d="M3 8h18v4H3zM5 12v9h14v-9M12 8v13M12 8c-3 0-4-4-1-4 2 0 1 4 1 4zM12 8c3 0 4-4 1-4-2 0-1 4-1 4z"/>',plane:'<path d="M3 13l18-9-7 17-3-7z"/>',book:'<path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6M20 4v14h-6"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',shirt:'<path d="M8 3L3 7l3 3 2-1v12h8V9l2 1 3-3-5-4a4 4 0 0 1-8 0z"/>',music:'<path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-3-3M20 16a3 3 0 1 1-3-3"/>'};
const DI={transp:'car',alim:'utensils',lazer:'film',compras:'bag',saude:'heart',fac:'cap',outros:'box'},MIG={'#0ea5e9':'#3b9eff','#f59e0b':'#ffd43b','#a855f7':'#ff3d8b','#ec4899':'#a78bfa','#16a34a':'#22e07a','#6366f1':'#22d3ee','#64748b':'#9ca3af'};
const PK=['car','utensils','film','bag','heart','cap','box','tag','coffee','gift','plane','book','bolt','phone','shirt','music'],NI=['home','up','down','clock','chart','cog'];
const ico=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none">${IC[n]||IC.tag}</svg>`;
function pickIc(k,b){$('#ce').value=k;document.querySelectorAll('.ip button').forEach(x=>x.classList.toggle('on',x===b))}
const S={tx:[],cats:[],srcs:[],cfg:{initial:0,theme:'auto'}};let db=null,page='ov',ASK=null,DR=null,noDb=false;
const DC=[['transp','Transporte','🚗','#0ea5e9'],['alim','Alimentação','🍽️','#f59e0b'],['lazer','Lazer','🎬','#a855f7'],['compras','Compras','🛍️','#ec4899'],['saude','Saúde','💚','#16a34a'],['fac','Faculdade','🎓','#6366f1'],['outros','Outros','📦','#64748b']];
const DS=[['salario','Salário'],['free','Freelancer'],['familia','Família'],['venda','Venda'],['outros_in','Outros']];
/* ---------- armazenamento (IndexedDB) ---------- */
const openDb=()=>new Promise((res,rej)=>{const r=indexedDB.open('fin-pessoal',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const kvGet=k=>new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()});
const kvSet=(k,v)=>new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)});
const save=async()=>{if(db)for(const k of Object.keys(S))await kvSet(k,JSON.parse(JSON.stringify(S[k])))};
async function commit(msg){try{await save()}catch(e){toast('Erro ao salvar: '+e.message)}render();if(msg)toast(msg)}
/* ---------- cálculos centralizados (centavos inteiros) ---------- */
const inR=(t,r)=>t.date>=r[0]&&t.date<=r[1],sum=(l,ty)=>l.filter(t=>t.type===ty).reduce((s,t)=>s+t.cents,0);
const balance=()=>S.cfg.initial+sum(S.tx,'in')-sum(S.tx,'out'),ek=n=>(n||'Sem nome').trim().toLowerCase();
const sortTx=(a,b)=>(b.date+b.time).localeCompare(a.date+a.time);
function group(l,f){const m=new Map();l.forEach(t=>{const k=f(t),g=m.get(k)||{k,total:0,n:0,items:[]};g.total+=t.cents;g.n++;g.items.push(t);m.set(k,g)});return[...m.values()].sort((a,b)=>b.total-a.total)}
const P={ov:'month',out:'month',inc:'month',rep:'6m',c:null};
function range(p,c){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),M=(a,b)=>[ds(new Date(y,m+a,1)),ds(new Date(y,m+b+1,0))];
 switch(p){case'today':return[today(),today()];case'7d':return[ds(new Date(y,m,n.getDate()-6)),today()];case'month':return M(0,0);case'prev':return M(-1,-1);case'3m':return[ds(new Date(y,m-2,1)),today()];case'6m':return[ds(new Date(y,m-5,1)),today()];case'12m':return[ds(new Date(y,m-11,1)),today()];case'year':return[y+'-01-01',today()];default:return c||M(0,0)}}
function months(r){const b=(r[1]<today()?r[1]:today()).slice(0,7),o=[];let[y,m]=r[0].split('-').map(Number);while(`${y}-${pad(m)}`<=b){o.push(`${y}-${pad(m)}`);if(++m>12){m=1;y++}}return o}
const catOf=id=>S.cats.find(c=>c.id===id)||{name:'(removida)',icon:'❓',color:'#999'},srcOf=id=>S.srcs.find(s=>s.id===id)||{name:'(removida)'};
const label=t=>t.type==='out'?catOf(t.cat).name:srcOf(t.cat).name;
/* ---------- UI helpers ---------- */
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
const modal=h=>{$('#m').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="sheet">${h}</div></div>`},closeM=()=>{$('#m').innerHTML=''};
const ask=(msg,fn)=>{ASK=fn;modal(`<h2>Confirmar</h2><p>${msg}</p><div class="row"><button class="btn2" onclick="closeM()">Cancelar</button><button class="btn red" onclick="closeM();ASK()">Confirmar</button></div>`)};
const empty=m=>`<div class="empty">${m}</div>`,err=m=>{$('#fe').textContent=m};
const PL={today:'Hoje','7d':'7 dias',month:'Mês atual',prev:'Mês anterior','3m':'3 meses','6m':'6 meses','12m':'12 meses',year:'Ano atual',custom:'Personalizado'};
function chips(k,o){return`<div class="chips">${o.map(x=>`<button class="chip ${P[k]===x?'on':''}" onclick="sp('${k}','${x}')">${PL[x]}</button>`).join('')}</div>`+(P[k]==='custom'?`<div class="row" style="margin-bottom:12px"><input type="date" value="${P.c[0]}" onchange="P.c[0]=this.value;render()"><input type="date" value="${P.c[1]}" onchange="P.c[1]=this.value;render()"></div>`:'')}
function sp(k,o){P[k]=o;if(o==='custom'&&!P.c)P.c=range('month');render()}
const ALL=['today','7d','month','prev','3m','6m','12m','year','custom'];
const row=t=>{const o=t.type==='out',c=catOf(t.cat);return`<div class="tx" onclick="det('${t.id}')"><div class="ic" style="background:${o?c.color+'28':'#22e07a28'};color:${o?c.color:'#22e07a'}">${ico(o?c.icon:'wallet',22)}</div><div class="g"><b>${esc(o?(t.name||c.name):label(t))}${t.demo?' <i class="demo">demo</i>':''}</b><small>${esc(label(t))} · ${fd(t.date)} ${t.time}</small></div><b class="${o?'neg':'pos'}">${o?'−':'+'}${brl(t.cents)}</b></div>`};
const list=(l,n=200)=>l.length?[...l].sort(sortTx).slice(0,n).map(row).join(''):empty('Nenhuma movimentação neste período.');
function bars(cg,tot,src){return cg.length?cg.map(g=>{const c=catOf(g.k),p=tot?g.total/tot*100:0;return`<div class="cb" onclick="dr('${src}','${g.k}')"><div class="t"><span><span style="color:${c.color}">${ico(c.icon)}</span> ${esc(c.name)}</span><b>${brl(g.total)} <small style="display:inline">${p.toFixed(0)}%</small></b></div><div class="p"><i style="width:${p}%;background:${c.color}"></i></div></div>`}).join(''):empty('Sem gastos neste período.')}
/* ---------- telas ---------- */
const demoBanner=()=>S.tx.some(t=>t.demo)?`<div class="warn">Há <b>dados de demonstração</b> misturados nos seus números. <button class="lnk" onclick="rmDemo()">Remover demonstração</button></div>`:'';
function ov(){const r=range(P.ov),L=S.tx.filter(t=>inR(t,r)),i=sum(L,'in'),o=sum(L,'out');
return`${demoBanner()}${chips('ov',['month','prev','6m','12m'])}<div class="hero"><small>Saldo disponível</small><h1>${brl(balance())}</h1><small>Saldo inicial + entradas − gastos (todo o histórico)</small><div class="row" style="margin-top:12px"><button class="btn2" onclick="txForm('out')">− Gasto</button><button class="btn2" onclick="txForm('in')">+ Entrada</button></div></div>
<div class="grid3"><div class="card"><small>Entradas</small><b class="pos">${brl(i)}</b></div><div class="card"><small>Gastos</small><b class="neg">${brl(o)}</b></div><div class="card"><small>Movimentações</small><b>${L.length}</b></div></div>
<h3>Últimas movimentações</h3><div class="card">${list(L,8)}</div><h3>Gastos por categoria</h3><div class="card">${bars(group(L.filter(t=>t.type==='out'),t=>t.cat),o,'ov')}</div>`}
function out(){const r=range(P.out,P.c),L=S.tx.filter(t=>t.type==='out'&&inR(t,r)),tot=sum(L,'out');
return`<div class="bar"><h2>Gastos</h2><button class="btn" onclick="txForm('out')">+ Novo gasto</button></div>${chips('out',ALL)}<div class="card"><small>Total gasto no período</small><b class="neg" style="font-size:22px">${brl(tot)}</b></div>
${group(L,t=>t.cat).map(g=>{const c=catOf(g.k);return`<details class="card"><summary><span><span style="color:${c.color}">${ico(c.icon)}</span> ${esc(c.name)}</span><b>${brl(g.total)}</b></summary>${group(g.items,t=>ek(t.name)).map(e=>`<div class="er" onclick="dr('out','${g.k}','${enc(e.k)}')"><span>${esc(e.items[0].name||'Sem nome')} <small style="display:inline">(${e.n})</small></span><b>${brl(e.total)}</b></div>`).join('')}<button class="lnk" onclick="dr('out','${g.k}')">Ver detalhes de ${esc(c.name)}</button></details>`}).join('')||empty('Nenhum gasto neste período.')}
<h3>Lançamentos</h3><div class="card">${list(L)}</div>`}
function inc(){const r=range(P.inc,P.c),L=S.tx.filter(t=>t.type==='in'&&inR(t,r));
return`<div class="bar"><h2>Entradas</h2><button class="btn" onclick="txForm('in')">+ Nova entrada</button></div>${chips('inc',ALL)}<div class="card"><small>Total recebido no período</small><b class="pos" style="font-size:22px">${brl(sum(L,'in'))}</b>${group(L,t=>t.cat).map(g=>`<div class="er"><span>${esc(srcOf(g.k).name)} <small style="display:inline">(${g.n})</small></span><b>${brl(g.total)}</b></div>`).join('')}</div><h3>Lançamentos</h3><div class="card">${list(L)}</div>`}
const H={type:'',cat:'',est:'',month:'',year:'',from:'',to:'',q:''};
function hist(){const ys=[...new Set(S.tx.map(t=>t.date.slice(0,4)))].sort().reverse(),es=[...new Map(S.tx.filter(t=>t.type==='out'&&t.name).map(t=>[ek(t.name),t.name]))],o=(v,l,s)=>`<option value="${esc(v)}" ${s===v?'selected':''}>${esc(l)}</option>`,f=(k,x)=>`onchange="H.${k}=this.value;hl()"`;
return`<h2>Histórico</h2><div class="card"><input class="full" placeholder="Buscar estabelecimento, origem ou observação" value="${esc(H.q)}" oninput="H.q=this.value;hl()"><div class="fl">
<select ${f('type')}>${o('','Todos os tipos',H.type)}${o('out','Gastos',H.type)}${o('in','Entradas',H.type)}</select>
<select ${f('cat')}>${o('','Toda categoria/origem',H.cat)}${S.cats.map(c=>o(c.id,c.name,H.cat)).join('')}${S.srcs.map(c=>o(c.id,c.name+' (entrada)',H.cat)).join('')}</select>
<select ${f('est')}>${o('','Todo estabelecimento',H.est)}${es.map(([k,n])=>o(k,n,H.est)).join('')}</select>
<select ${f('year')}>${o('','Todo ano',H.year)}${ys.map(y=>o(y,y,H.year)).join('')}</select>
<input type="month" value="${H.month}" ${f('month')} title="Mês"><input type="date" value="${H.from}" ${f('from')} title="De"><input type="date" value="${H.to}" ${f('to')} title="Até"></div>
<button class="lnk" onclick="Object.keys(H).forEach(k=>H[k]='');render()">Limpar filtros</button></div><div id="hl" class="card"></div>`}
function hl(){const q=H.q.trim().toLowerCase(),L=S.tx.filter(t=>(!H.type||t.type===H.type)&&(!H.cat||t.cat===H.cat)&&(!H.est||(t.type==='out'&&ek(t.name)===H.est))&&(!H.year||t.date.startsWith(H.year))&&(!H.month||t.date.startsWith(H.month))&&(!H.from||t.date>=H.from)&&(!H.to||t.date<=H.to)&&(!q||(t.name+' '+t.note+' '+label(t)).toLowerCase().includes(q)));
$('#hl').innerHTML=`<small style="margin-bottom:6px">${L.length} registros · entradas ${brl(sum(L,'in'))} · gastos ${brl(sum(L,'out'))}</small>`+list(L)}
function rep(){const r=range(P.rep,P.c),end=r[1]<today()?r[1]:today(),L=S.tx.filter(t=>inR(t,r)),i=sum(L,'in'),o=sum(L,'out'),ms=months(r),days=Math.max(1,Math.round((new Date(end)-new Date(r[0]))/864e5)+1),O=L.filter(t=>t.type==='out'),cg=group(O,t=>t.cat),eg=group(O,t=>ek(t.name)).slice(0,8),md=ms.map(k=>{const l=L.filter(t=>t.date.startsWith(k));return{k,i:sum(l,'in'),o:sum(l,'out')}});
const mx=Math.max(1,...md.flatMap(m=>[m.i,m.o])),gw=300/Math.max(md.length,1);
const svg=md.length?`<svg viewBox="0 0 320 150" width="100%">${md.map((m,x)=>{const a=m.i/mx*100,b=m.o/mx*100,X=10+x*gw,w=Math.min(14,gw/2.6);return`<g onclick="mon('${m.k}')" style="cursor:pointer"><rect x="${X+gw/2-w-1}" y="${120-a}" width="${w}" height="${a}" rx="3" fill="var(--ac)"/><rect x="${X+gw/2+1}" y="${120-b}" width="${w}" height="${b}" rx="3" fill="var(--rd)"/><text x="${X+gw/2}" y="138" font-size="${md.length>8?7:9}" text-anchor="middle" fill="var(--mu)">${ml(m.k)}</text></g>`}).join('')}</svg>`:'';
let off=0;const R=40,C=2*Math.PI*R,dn=o?`<svg viewBox="0 0 120 120" width="150">${cg.map(g=>{const f=g.total/o,s=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${catOf(g.k).color}" stroke-width="18" stroke-dasharray="${f*C} ${C}" stroke-dashoffset="${-off*C}" transform="rotate(-90 60 60)" onclick="dr('rep','${g.k}')" style="cursor:pointer"/>`;off+=f;return s}).join('')}<text x="60" y="64" font-size="9" text-anchor="middle" fill="var(--tx)">${brl(o)}</text></svg>`:'';
return`<h2>Relatórios</h2>${chips('rep',ALL)}<label style="margin:0 0 12px">Ver um mês específico<input type="month" onchange="pm(this.value)"></label>
<div class="two"><div class="card"><small>Total recebido</small><b class="pos">${brl(i)}</b></div><div class="card"><small>Total gasto</small><b class="neg">${brl(o)}</b></div><div class="card"><small>Resultado do período</small><b>${brl(i-o)}</b></div><div class="card"><small>Saldo atual (todo o histórico)</small><b>${brl(balance())}</b></div><div class="card"><small>Média diária de gastos</small><b>${brl(Math.round(o/days))}</b></div><div class="card"><small>Média mensal de gastos</small><b>${brl(Math.round(o/Math.max(ms.length,1)))}</b></div><div class="card"><small>Maior / menor categoria</small><b>${cg.length?esc(catOf(cg[0].k).name)+' / '+esc(catOf(cg[cg.length-1].k).name):'—'}</b></div><div class="card"><small>Movimentações</small><b>${L.length}</b></div></div>
<h3>Mês a mês</h3><div class="card">${md.length?`<table><tr><th>Mês</th><th>Entradas</th><th>Gastos</th><th>Resultado</th></tr>${md.map(m=>`<tr onclick="mon('${m.k}')"><td>${ml(m.k)}</td><td class="pos">${brl(m.i)}</td><td class="neg">${brl(m.o)}</td><td>${brl(m.i-m.o)}</td></tr>`).join('')}<tr><td><b>Total</b></td><td><b>${brl(i)}</b></td><td><b>${brl(o)}</b></td><td><b>${brl(i-o)}</b></td></tr></table>${svg}<small><b class="pos">■</b> entradas · <b class="neg">■</b> gastos — toque numa barra para ver os lançamentos</small>`:empty('Sem meses neste período.')}</div>
<h3>Gastos por categoria</h3><div class="card"><div style="text-align:center">${dn}</div>${bars(cg,o,'rep')}</div>
<h3>Maiores estabelecimentos</h3><div class="card">${eg.map(e=>`<div class="er" onclick="dr('rep','','${enc(e.k)}')"><span>${esc(e.items[0].name||'Sem nome')} <small style="display:inline">(${e.n})</small></span><b>${brl(e.total)}</b></div>`).join('')||empty('Sem gastos.')}</div>`}
function pm(v){if(!v)return;const[y,m]=v.split('-').map(Number);P.rep='custom';P.c=[v+'-01',ds(new Date(y,m,0))];render()}
function mon(k){listModal(ml(k),S.tx.filter(t=>t.date.startsWith(k)))}
const listModal=(t,l)=>modal(`<h2>${esc(t)}</h2>${list(l)}<button class="btn2" style="width:100%;margin-top:10px" onclick="closeM()">Fechar</button>`);
function cfg(){return`<h2>Configurações</h2>${demoBanner()}<div class="card"><b>Saldo inicial</b><div class="row"><input id="ci" inputmode="numeric" value="${brl(S.cfg.initial)}" data-c="${S.cfg.initial}" oninput="mk(this)"><button class="btn" onclick="S.cfg.initial=+$('#ci').dataset.c;commit('Saldo inicial salvo')">Salvar</button></div>
<label>Tema<select onchange="S.cfg.theme=this.value;theme();commit()"><option value="auto" ${S.cfg.theme!='light'?'selected':''}>Escuro (padrão)</option><option value="light" ${S.cfg.theme=='light'?'selected':''}>Claro</option></select></label><small style="margin-top:8px">Moeda: Real brasileiro (R$) · datas dd/mm/aaaa · horário 24h</small></div>
<div class="card"><div class="bar"><b>Categorias de gastos</b><button class="btn2" onclick="catForm()">+ Nova</button></div>${S.cats.map(c=>`<div class="er"><span><span style="color:${c.color}">${ico(c.icon)}</span> ${esc(c.name)}${c.archived?' <small style="display:inline">(arquivada)</small>':''}</span><span><button class="ib" title="Editar" aria-label="Editar" onclick="catForm('${c.id}')">${ico('pen')}</button><button class="ib d" title="Excluir" aria-label="Excluir" onclick="delCat('${c.id}')">${ico('trash')}</button></span></div>`).join('')}</div>
<div class="card"><div class="bar"><b>Origens das entradas</b><button class="btn2" onclick="srcForm()">+ Nova</button></div>${S.srcs.map(s=>`<div class="er"><span>${esc(s.name)}</span><span><button class="ib" title="Editar" aria-label="Editar" onclick="srcForm('${s.id}')">${ico('pen')}</button><button class="ib d" title="Excluir" aria-label="Excluir" onclick="delSrc('${s.id}')">${ico('trash')}</button></span></div>`).join('')}</div>
<div class="card"><b>Dados e backup</b><small style="margin:6px 0 10px">Seus dados ficam salvos só neste navegador/dispositivo (IndexedDB). Não há sincronização entre aparelhos — faça backups com frequência.</small><div class="row"><button class="btn" onclick="exp()">Exportar JSON</button><button class="btn2" onclick="imp()">Importar backup</button></div><div class="row" style="margin-top:10px"><button class="btn2" onclick="mkDemo()">Carregar demonstração</button><button class="btn2" onclick="rmDemo()">Remover demonstração</button></div><small id="stg" style="margin-top:10px">${S.tx.length} lançamentos · ${S.cats.length} categorias${noDb?' · ⚠️ armazenamento local indisponível: dados só durante esta sessão':''}</small></div>`}
/* ---------- formulários ---------- */
function mk(e){const c=Math.min(+(e.value.replace(/\D/g,'')||0),99999999999);e.dataset.c=c;e.value=brl(c)}
function txForm(type,id){const t=id?S.tx.find(x=>x.id===id):null,o=type==='out',d=new Date(),opts=(o?S.cats.filter(c=>!c.archived||(t&&t.cat===c.id)):S.srcs).map(x=>`<option value="${x.id}" ${t&&t.cat===x.id?'selected':''}>${esc(x.name)}</option>`).join('');
modal(`<h2>${t?'Editar':'Novo'} ${o?'gasto':'entrada'}</h2><label>Valor<input id="fv" inputmode="numeric" value="${brl(t?t.cents:0)}" data-c="${t?t.cents:0}" oninput="mk(this)"></label><div class="row"><label>Data<input id="fd" type="date" value="${t?t.date:today()}"></label><label>Horário<input id="ft" type="time" value="${t?t.time:pad(d.getHours())+':'+pad(d.getMinutes())}"></label></div>
${o?`<label>Estabelecimento ou destinatário<input id="fn" list="dl" value="${esc(t?t.name:'')}" placeholder="Uber, mercado, nome..."></label><datalist id="dl">${[...new Set(S.tx.map(x=>x.name).filter(Boolean))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`:''}
<label>${o?'Categoria':'Origem'}<select id="fc">${opts}</select></label>${o?'':'<label>Ou criar nova origem<input id="fns" placeholder="opcional"></label>'}<label>Observação (opcional)<input id="fo" value="${esc(t?t.note:'')}"></label><div class="err" id="fe"></div><div class="row"><button class="btn2" onclick="closeM()">Cancelar</button><button class="btn" onclick="saveTx('${type}','${id||''}')">Salvar</button></div>`)}
function saveTx(type,id){const c=+$('#fv').dataset.c,date=$('#fd').value,time=$('#ft').value;let cat=$('#fc').value;
if(!(c>0))return err('Informe um valor maior que zero.');if(!date||!time)return err('Informe data e horário.');
if(type==='in'){const ns=$('#fns').value.trim();if(ns){const s={id:uid(),name:ns};S.srcs.push(s);cat=s.id}}
if(!cat)return err('Escolha uma '+(type==='out'?'categoria':'origem')+'.');
const o={id:id||uid(),type,cents:c,date,time,name:type==='out'?$('#fn').value.trim():'',cat,note:$('#fo').value.trim()};
if(id){const i=S.tx.findIndex(x=>x.id===id);S.tx[i]=o}else S.tx.push(o);closeM();commit('Salvo com sucesso!')}
function det(id){const t=S.tx.find(x=>x.id===id);if(!t)return;modal(`<h2>${t.type==='out'?'Gasto':'Entrada'}</h2><div class="card"><b class="${t.type==='out'?'neg':'pos'}" style="font-size:24px">${brl(t.cents)}</b>${t.type==='out'?`<small>Estabelecimento: ${esc(t.name||'—')}</small>`:''}<small>${t.type==='out'?'Categoria':'Origem'}: ${esc(label(t))}</small><small>${fd(t.date)} às ${t.time}</small><small>Obs.: ${esc(t.note||'—')}</small></div><div class="row"><button class="btn2" onclick="closeM()">Fechar</button><button class="btn2" title="Editar" aria-label="Editar" onclick="txForm('${t.type}','${t.id}')">${ico('pen',20)}</button><button class="btn red" title="Excluir" aria-label="Excluir" onclick="ask('Excluir este lançamento?',()=>{S.tx=S.tx.filter(x=>x.id!=='${t.id}');commit('Lançamento excluído')})">${ico('trash',20)}</button></div>`)}
function dr(src,cat,est){DR=range(P[src],P.c);drill(cat,est)}
function drill(cat,est){const e=est?decodeURIComponent(est):'',l=S.tx.filter(t=>t.type==='out'&&inR(t,DR)&&(!cat||t.cat===cat)&&(!e||ek(t.name)===e)),nm=e?(l[0]?l[0].name||'Sem nome':e):catOf(cat).name;
modal(`<h2>${esc(nm)}</h2><div class="card"><small>Total no período (${fd(DR[0])} a ${fd(DR[1])})</small><b class="neg" style="font-size:22px">${brl(sum(l,'out'))}</b></div>${e?list(l):group(l,t=>ek(t.name)).map(g=>`<div class="er" onclick="drill('${cat}','${enc(g.k)}')"><span>${esc(g.items[0].name||'Sem nome')} <small style="display:inline">(${g.n})</small></span><b>${brl(g.total)}</b></div>`).join('')||empty('Sem gastos.')}<div class="row" style="margin-top:10px">${e&&cat?`<button class="btn2" onclick="drill('${cat}')">← Voltar</button>`:''}<button class="btn" onclick="closeM()">Fechar</button></div>`)}
/* ---------- categorias e origens ---------- */
function catForm(id){const c=S.cats.find(x=>x.id===id)||{name:'',icon:'🏷️',color:'#16a34a'};modal(`<h2>${id?'Editar':'Nova'} categoria</h2><label>Nome<input id="cn" value="${esc(c.name)}"></label><label>Cor<input id="cc" type="color" value="${c.color}"></label><label>Ícone</label><input id="ce" type="hidden" value="${c.icon}"><div class="ip">${PK.map(k=>`<button type="button" class="${c.icon===k?'on':''}" onclick="pickIc('${k}',this)">${ico(k,22)}</button>`).join('')}</div><div class="err" id="fe"></div><div class="row"><button class="btn2" onclick="closeM()">Cancelar</button><button class="btn" onclick="saveCat('${id||''}')">Salvar</button></div>`)}
function saveCat(id){const n=$('#cn').value.trim();if(!n)return err('Informe um nome.');const o={id:id||uid(),name:n,icon:IC[$('#ce').value]?$('#ce').value:'tag',color:$('#cc').value};if(id){const i=S.cats.findIndex(c=>c.id===id);o.archived=S.cats[i].archived;S.cats[i]=o}else S.cats.push(o);closeM();commit('Categoria salva')}
function delCat(id){if(!S.tx.some(t=>t.cat===id))return ask('Excluir esta categoria?',()=>{S.cats=S.cats.filter(c=>c.id!==id);commit('Categoria excluída')});
const os=S.cats.filter(c=>c.id!==id&&!c.archived);modal(`<h2>Categoria em uso</h2><p>Existem lançamentos nesta categoria. Eles não serão apagados. Escolha:</p>${os.length?`<label>Mover os lançamentos para<select id="mv">${os.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><button class="btn" style="width:100%;margin-top:8px" onclick="mvCat('${id}')">Mover e excluir categoria</button>`:''}<button class="btn2" style="width:100%;margin-top:8px" onclick="S.cats.find(c=>c.id==='${id}').archived=true;closeM();commit('Categoria arquivada')">Manter arquivada</button><button class="lnk" onclick="closeM()">Cancelar</button>`)}
function mvCat(id){const to=$('#mv').value;S.tx.forEach(t=>{if(t.type==='out'&&t.cat===id)t.cat=to});S.cats=S.cats.filter(c=>c.id!==id);closeM();commit('Lançamentos movidos')}
function srcForm(id){const s=S.srcs.find(x=>x.id===id);modal(`<h2>${id?'Editar':'Nova'} origem</h2><label>Nome<input id="sn" value="${esc(s?s.name:'')}"></label><div class="err" id="fe"></div><div class="row"><button class="btn2" onclick="closeM()">Cancelar</button><button class="btn" onclick="saveSrc('${id||''}')">Salvar</button></div>`)}
function saveSrc(id){const n=$('#sn').value.trim();if(!n)return err('Informe um nome.');if(id)S.srcs.find(s=>s.id===id).name=n;else S.srcs.push({id:uid(),name:n});closeM();commit('Origem salva')}
function delSrc(id){if(S.tx.some(t=>t.cat===id))return toast('Origem em uso: edite os lançamentos antes de excluir.');ask('Excluir esta origem?',()=>{S.srcs=S.srcs.filter(s=>s.id!==id);commit('Origem excluída')})}
/* ---------- backup ---------- */
const bk=()=>JSON.stringify({app:'fin-pessoal',v:1,exportedAt:new Date().toISOString(),tx:S.tx,cats:S.cats,srcs:S.srcs,cfg:S.cfg},null,1);
function exp(){const j=bk();try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='backup-financas-'+today()+'.json';a.click()}catch(e){}
modal(`<h2>Backup (JSON)</h2><p style="font-size:14px">Se o download não iniciar, copie o texto abaixo e salve num arquivo .json.</p><textarea id="bt" readonly onclick="this.select()">${esc(j)}</textarea><button class="btn" style="width:100%;margin-top:10px" onclick="closeM()">Fechar</button>`)}
function imp(){modal(`<h2>Importar backup</h2><input type="file" accept=".json,application/json" onchange="fileIn(this)"><label>ou cole o JSON aqui<textarea id="it"></textarea></label><div class="err" id="fe"></div><div class="row"><button class="btn2" onclick="closeM()">Cancelar</button><button class="btn" onclick="doImp($('#it').value)">Validar e importar</button></div>`)}
function fileIn(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImp(r.result);r.readAsText(f)}
function valid(o){if(!o||o.app!=='fin-pessoal'||!Array.isArray(o.tx)||!Array.isArray(o.cats)||!Array.isArray(o.srcs))return'Arquivo não é um backup válido deste app.';const ids=new Set();
for(const c of[...o.cats,...o.srcs])if(!c||typeof c.id!=='string'||typeof c.name!=='string'||ids.has(c.id))return'Categorias/origens inválidas ou duplicadas.';else ids.add(c.id);
const tid=new Set();for(const t of o.tx){if(!t||typeof t.id!=='string'||tid.has(t.id)||!['in','out'].includes(t.type)||!Number.isSafeInteger(t.cents)||t.cents<=0||!/^\d{4}-\d{2}-\d{2}$/.test(t.date)||!/^\d{2}:\d{2}$/.test(t.time)||!ids.has(t.cat))return'Há lançamentos inválidos, duplicados ou sem categoria/origem.';tid.add(t.id)}
if(o.cfg&&!Number.isSafeInteger(o.cfg.initial))return'Saldo inicial inválido.';return null}
function doImp(txt){let o;try{o=JSON.parse(txt)}catch(e){return err('JSON inválido.')}const e=valid(o);if(e)return err(e);
ask(`Importar ${o.tx.length} lançamentos? Isso <b>substitui todos os dados atuais</b> (${S.tx.length} lançamentos).`,()=>{S.tx=o.tx;S.cats=o.cats;S.srcs=o.srcs;S.cfg={initial:o.cfg?o.cfg.initial:0,theme:(o.cfg&&o.cfg.theme)||'auto'};theme();commit('Backup importado')})}
function mkDemo(){const n=new Date(),T=[['Uber','transp',2350],['99','transp',1580],["McDonald's",'alim',3290],['Mercado','alim',9840],['Padaria','alim',1450],['Cinema','lazer',4200],['Farmácia','saude',3120],['Wellhub','saude',9990],['Loja de roupas','compras',15900],['Livraria','fac',8700],['Pix amigo','outros',5000]];
for(let k=5;k>=0;k--){const y=new Date(n.getFullYear(),n.getMonth()-k,1),D=(d,h)=>({date:ds(new Date(y.getFullYear(),y.getMonth(),d)),time:h}),cur=k===0;
T.forEach((t,i)=>{const d=2+i*2;if(cur&&d>n.getDate())return;S.tx.push({id:uid(),type:'out',cents:t[2]+((k*137+i*53)%900),name:t[0],cat:t[1],note:'',demo:1,...D(d,pad(8+i)+':'+pad(i*5))})});
if(!cur||n.getDate()>=5)S.tx.push({id:uid(),type:'in',cents:120000,name:'',cat:'salario',note:'Estágio',demo:1,...D(5,'09:00')});
if(k%2===0&&(!cur||n.getDate()>=18))S.tx.push({id:uid(),type:'in',cents:25000,name:'',cat:'free',note:'Página web',demo:1,...D(18,'16:00')})}commit('Demonstração carregada (identificada como "demo")')}
const rmDemo=()=>ask('Remover todos os lançamentos de demonstração?',()=>{S.tx=S.tx.filter(t=>!t.demo);commit('Demonstração removida')});
/* ---------- app ---------- */
const NAV=[['ov','🏠','Visão geral',ov],['out','💸','Gastos',out],['inc','💰','Entradas',inc],['hist','🕘','Histórico',hist],['rep','📊','Relatórios',rep],['cfg','⚙️','Config.',cfg]];
function theme(){S.cfg.theme==='light'?document.documentElement.dataset.theme='light':document.documentElement.removeAttribute('data-theme')}
function render(){$('#nav').innerHTML=NAV.map((n,i)=>`<button class="${page===n[0]?'on':''}" onclick="page='${n[0]}';render();scrollTo(0,0)">${ico(NI[i],22)}${n[2]}</button>`).join('');
try{$('#v').innerHTML=NAV.find(n=>n[0]===page)[3]();if(page==='hist')hl()}catch(e){$('#v').innerHTML=empty('Erro ao exibir: '+esc(e.message))}}
(async()=>{try{await openDb();for(const k of Object.keys(S)){const v=await kvGet(k);if(v!==undefined)S[k]=v}}catch(e){noDb=true}
if(!S.cats.length)S.cats=DC.map(c=>({id:c[0],name:c[1],icon:c[2],color:c[3]}));if(!S.srcs.length)S.srcs=DS.map(s=>({id:s[0],name:s[1]}));S.cats.forEach(c=>{if(!IC[c.icon])c.icon=DI[c.id]||'tag';if(MIG[c.color])c.color=MIG[c.color]});
try{await save()}catch(e){noDb=true}theme();render()})();
</script><script>if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
