function fileIn(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImp(r.result);r.readAsText(f)}
function valid(o){if(!o||o.app!=='fin-pessoal'||!Array.isArray(o.tx)||!Array.isArray(o.cats)||!Array.isArray(o.srcs))return'Arquivo não é um backup válido deste app.';const ids=new Set();
for(const c of[...o.cats,...o.srcs])if(!c||typeof c.id!=='string'||typeof c.name!=='string'||ids.has(c.id)||(c.limit!==undefined&&!(Number.isSafeInteger(c.limit)&&c.limit>=0)))return'Categorias/origens inválidas ou duplicadas.';else ids.add(c.id);
if(o.acc){if(!Array.isArray(o.acc))return'Contas inválidas.';for(const a of o.acc)if(!a||typeof a.id!=='string'||typeof a.name!=='string'||!Number.isSafeInteger(a.initial)||!['conta','reserva'].includes(a.type))return'Contas inválidas.'}
const aid=new Set((o.acc||[]).map(a=>a.id)),tid=new Set();for(const t of o.tx){if(!t||typeof t.id!=='string'||tid.has(t.id)||!['in','out','tr','ad'].includes(t.type)||!Number.isSafeInteger(t.cents)||t.cents<=0||!/^\d{4}-\d{2}-\d{2}$/.test(t.date)||!/^\d{2}:\d{2}$/.test(t.time))return'Há lançamentos inválidos ou duplicados.';if(t.type==='tr'){if(!o.acc||!aid.has(t.from)||!aid.has(t.to))return'Transferência com conta inexistente.'}else if(t.type==='ad'){if(!o.acc||!aid.has(t.acc))return'Adição com conta inexistente.'}else if(!ids.has(t.cat)||(o.acc&&!aid.has(t.acc)))return'Lançamento sem categoria, origem ou conta válida.';tid.add(t.id)}
if(o.cfg&&!Number.isSafeInteger(o.cfg.initial))return'Saldo inicial inválido.';return null}
